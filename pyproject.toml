[project]
name = "paper-trader"
version = "0.1.0"
description = "Paper-Trading-Bot fuer Hyperliquid BTC-Perp Breakout-Strategie"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pyarrow>=15.0",
    "plotly>=5.18",
    "python-json-logger>=2.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
